<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body><title>세르클 화면 방향 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 시안 틀: 위에 방향 고르기 띠, 아래에 세르클 화면 한 장(왼쪽 메뉴 216px + 본문). 방향 셋이 같은 메뉴와 같은 숫자를 쓰고 본문 보여 주는 방식만 다르다 */
:root {
  color-scheme: light;
  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --soft: #F1F2F5;
  --tile: #F6F7F9;
  --ink: #16181D;
  --title: #3B4250;
  --muted: #5B6270;
  --off: #8A909B;
  --line: #E3E5EA;
  --line-soft: #EEF0F3;
  --accent: #C2492A;
  --accent-hover: #A63F22;
  --accent-tint: #FFF3EE;
  --accent-bar: #F2B8A2;
  --warn-fg: #8F5B00;
  --warn-bg: #FDF3DC;
  --good-fg: #1C7A4F;
  --good-bg: #E3F4EA;
  --nav-bg: #1F232A;
  --nav-title: #F2F3F5;
  --nav-fg: #B4BAC4;
  --nav-muted: #8A909B;
  --nav-on: #343A44;
  --nav-sep: #343A44;
  --tool-bg: #FFFFFF;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* 방향 고르기 띠 */
.tool { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--tool-bg); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--tool-bg); }
.tool-name { font-weight: 700; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--soft); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(22,24,29,.08); }
.tool-note { color: var(--muted); font-size: 12.5px; flex: 1 1 280px; min-width: 0; }

/* 세르클 화면 틀 */
.frame { display: flex; min-height: calc(100% - 56px); }
.rail { flex: 0 0 216px; background: var(--nav-bg); color: var(--nav-fg); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.rail-logo { display: flex; align-items: center; gap: 8px; color: var(--nav-title); font-weight: 700; font-size: 16px; padding: 0 8px 14px; }
.rail-logo i { width: 22px; height: 22px; border-radius: 50%; border: 5px solid #E2643E; display: inline-block; }
.rail-group { padding: 8px 0 10px; border-bottom: 1px solid var(--nav-sep); }
.rail-group:last-of-type { border-bottom: 0; }
.rail-cap { display: flex; gap: 10px; color: var(--nav-title); font-weight: 700; font-size: 13px; padding: 4px 8px 6px; }
.rail-cap b { color: var(--nav-muted); font-weight: 700; width: 12px; }
.rail-group.on .rail-cap b { color: #E2643E; }
.rail-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 8px 7px 30px; border-radius: 8px; font-size: 13px; }
.rail-group.plain .rail-item { padding-left: 18px; }
.rail-item.on { background: var(--nav-on); color: var(--nav-title); font-weight: 700; }
.rail-badge { background: var(--accent); color: #fff; font-size: 11px; border-radius: 9px; padding: 0 7px; line-height: 18px; }
.rail-me { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px; font-size: 12.5px; color: var(--nav-muted); }
.rail-me i { width: 28px; height: 28px; border-radius: 50%; background: #343A44; color: var(--nav-title); font-style: normal; display: grid; place-items: center; font-weight: 700; }
.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--muted); }
.top strong { color: var(--ink); }
.top .sp { flex: 1; }
.tag-ex { background: var(--soft); color: var(--title); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
.body { flex: 1; padding: 28px 32px 48px; min-width: 0; }

/* 공용 조각 */
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn-main { background: var(--accent); color: #fff; }
.btn-main:hover { background: var(--accent-hover); }
.btn-soft { background: var(--soft); color: var(--title); }
.btn-line { background: var(--surface); border: 1px solid var(--line); color: var(--title); }
.btn-big { padding: 15px 20px; font-size: 16px; border-radius: 12px; }
.link { color: var(--accent); font-weight: 600; background: none; border: 0; padding: 0; font-size: inherit; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.chev { color: var(--off); font-size: 18px; line-height: 1; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 8px; background: var(--soft); color: var(--title); }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
.pill.good { background: var(--good-bg); color: var(--good-fg); }
.pill.acc { background: var(--accent-tint); color: var(--accent); }
.say { background: var(--tile); border-radius: 12px; padding: 14px 16px; color: var(--title); font-size: 14.5px; line-height: 1.6; }
.say small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 4px; }

/* A 한 문장 */
.a-wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 36px; }
.a-date { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.a-head { font-size: 30px; line-height: 1.35; font-weight: 800; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.a-head em { font-style: normal; color: var(--accent); }
.a-lead { font-size: 16px; color: var(--title); margin: 10px 0 0; }
.a-bar { margin-top: 20px; height: 10px; border-radius: 5px; background: var(--soft); display: flex; overflow: hidden; }
.a-bar span { display: block; height: 100%; }
.a-legend { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.a-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 22px; }
.a-sec h2 { font-size: 17px; margin: 0 0 6px; }
.a-rows { display: flex; flex-direction: column; }
.a-row { display: flex; align-items: center; gap: 14px; padding: 15px 4px; border-bottom: 1px solid var(--line-soft); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.a-row:hover { background: var(--surface); }
.a-row .t { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; }
.a-row .t small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
.a-row .v { font-weight: 700; white-space: nowrap; }
.a-more { margin-top: 12px; }
.d-wrap { max-width: 800px; }
.d-chart { background: var(--surface); border-radius: 16px; padding: 14px 18px 14px; margin-top: 20px; }
.d-chart .c-chart { margin-top: 0; }
.a-call { max-width: 600px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.a-prog { display: flex; align-items: center; gap: 12px; }
.a-prog .track { flex: 1; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.a-prog .track span { display: block; height: 100%; width: 5%; background: var(--ink); }
.a-card { background: var(--surface); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 3px rgba(22,24,29,.06); }
.a-name { font-size: 26px; font-weight: 800; margin: 6px 0 2px; }
.a-why { font-size: 18px; line-height: 1.5; font-weight: 600; margin: 0; text-wrap: pretty; }
.a-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.a-actions .btn-big { grid-column: 1 / -1; }
.a-next { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 4px; }
.a-done { margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 18px; }
.a-done-card { background: var(--surface); border-radius: 14px; padding: 20px; display: flex; gap: 14px; align-items: flex-start; max-width: 460px; opacity: .9; }
.a-done-card i { flex: 0 0 34px; height: 34px; border-radius: 50%; background: var(--good-bg); color: var(--good-fg); display: grid; place-items: center; font-style: normal; font-weight: 800; }

/* B 할 일 피드 */
.b-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 28px; max-width: 1080px; }
.b-hello { font-size: 22px; font-weight: 800; margin: 0 0 18px; letter-spacing: -0.01em; }
.b-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px; }
.b-tile { background: var(--surface); border-radius: 14px; padding: 16px 18px; }
.b-tile .k { font-size: 13px; color: var(--muted); }
.b-tile .v { font-size: 22px; font-weight: 800; margin: 4px 0 2px; }
.b-tile .v small { font-size: 14px; font-weight: 600; }
.b-tile .s { font-size: 12.5px; color: var(--muted); }
.b-tile .bar { height: 5px; border-radius: 3px; background: var(--soft); margin-top: 10px; overflow: hidden; }
.b-tile .bar span { display: block; height: 100%; background: var(--ink); }
.b-feed { display: flex; flex-direction: column; gap: 12px; }
.b-feed h2 { font-size: 15px; margin: 0 0 2px; color: var(--title); }
.b-card { background: var(--surface); border-radius: 14px; padding: 18px 20px; display: flex; gap: 18px; align-items: center; }
.b-card .c { flex: 1; min-width: 0; }
.b-card .t { font-size: 16px; font-weight: 700; margin: 6px 0 3px; text-wrap: pretty; }
.b-card .s { color: var(--muted); font-size: 13.5px; }
.b-side { display: flex; flex-direction: column; gap: 14px; }
.b-box { background: var(--surface); border-radius: 14px; padding: 16px 18px; }
.b-box h3 { font-size: 14px; margin: 0 0 10px; }
.b-done { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--title); }
.b-done:first-of-type { border-top: 0; }
.b-done i { flex: 0 0 18px; height: 18px; border-radius: 50%; background: var(--good-bg); color: var(--good-fg); font-style: normal; font-size: 11px; font-weight: 800; display: grid; place-items: center; margin-top: 1px; }
.b-ask { display: flex; flex-direction: column; gap: 8px; }
.b-ask button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; font-size: 13px; }
.b-call { max-width: 960px; }
.b-reasons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px 0 20px; }
.b-reason { text-align: left; background: var(--surface); border: 2px solid transparent; border-radius: 14px; padding: 16px 18px; }
.b-reason.on { border-color: var(--ink); }
.b-reason .k { font-size: 13.5px; font-weight: 700; color: var(--title); }
.b-reason .v { font-size: 24px; font-weight: 800; margin: 2px 0; }
.b-reason .s { font-size: 12.5px; color: var(--muted); }
.b-list { background: var(--surface); border-radius: 14px; padding: 4px 0; }
.b-li { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-top: 1px solid var(--line-soft); }
.b-li:first-child { border-top: 0; }
.b-li .who { flex: 0 0 120px; font-weight: 700; font-size: 15px; }
.b-li .who small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.b-li .why { flex: 1; min-width: 0; color: var(--title); }
.b-li .amt { flex: 0 0 auto; font-weight: 700; white-space: nowrap; }
.b-li .go { display: flex; gap: 6px; }
.b-li .go .btn { padding: 8px 12px; font-size: 13px; border-radius: 8px; }
.b-li.done { color: var(--off); }
.b-li.done .who, .b-li.done .why, .b-li.done .amt { color: var(--muted); }
.b-li.done .why { text-decoration: none; }

/* C 그래프 먼저 */
.c-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; max-width: 1180px; }
.c-panel { background: var(--surface); border-radius: 14px; padding: 22px 24px; min-width: 0; }
.c-k { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.c-big { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 6px; }
.c-big small { font-size: 18px; font-weight: 700; }
.c-chart { width: 100%; height: auto; display: block; margin-top: 10px; }
.c-chart text { font-family: var(--font); font-size: 11px; fill: var(--muted); }
.c-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.c-legend span::before { content: ""; display: inline-block; width: 16px; height: 0; vertical-align: middle; margin-right: 6px; border-top: 2px solid var(--ink); }
.c-legend .fc::before { border-top: 2px dashed var(--accent); }
.c-legend .gl::before { border-top: 1px dashed var(--off); }
.c-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 18px; border-top: 1px solid var(--line-soft); }
.c-stat { padding: 14px 16px 2px 0; }
.c-stat + .c-stat { padding-left: 16px; border-left: 1px solid var(--line-soft); }
.c-stat .k { font-size: 12.5px; color: var(--muted); }
.c-stat .v { font-size: 18px; font-weight: 800; }
.c-stat .s { font-size: 12px; color: var(--muted); }
.c-stat svg { display: block; margin-top: 6px; }
.c-side { display: flex; flex-direction: column; gap: 16px; }
.c-side h3 { font-size: 15px; margin: 0 0 12px; }
.c-split { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.c-split .row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.c-split .bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.c-split .bar span { display: block; height: 100%; background: var(--accent-bar); }
.c-split .sub { grid-column: 2 / -1; color: var(--muted); font-size: 12.5px; margin-top: -6px; }
.c-todo { display: flex; flex-direction: column; }
.c-todo div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 13.5px; }
.c-todo div:first-child { border-top: 0; }
.c-call { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0; max-width: 1180px; background: var(--surface); border-radius: 14px; overflow: hidden; min-height: 640px; }
.c-list { border-right: 1px solid var(--line); min-width: 0; }
.c-list-head { padding: 18px 20px 14px; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; border-bottom: 1px solid var(--line); }
.c-list-head h1 { font-size: 18px; margin: 0; }
.c-meter { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.c-meter .track { width: 90px; height: 5px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.c-meter .track span { display: block; height: 100%; background: var(--ink); }
.c-filter { display: flex; gap: 14px; padding: 10px 20px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line-soft); }
.c-filter b { color: var(--ink); }
.c-row { display: grid; grid-template-columns: 10px 84px minmax(0, 1fr) 76px 62px; gap: 12px; align-items: center; padding: 11px 20px; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
.c-row.on { background: var(--tile); }
.c-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.c-row .dot.next { background: var(--off); }
.c-row .dot.sv { background: #7A8AA8; }
.c-row .n { font-weight: 700; }
.c-row .w { color: var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-row .m { text-align: right; font-weight: 600; }
.c-row .d { text-align: right; color: var(--muted); font-size: 12.5px; }
.c-detail { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.c-detail h2 { font-size: 22px; margin: 0; }
.c-facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.c-facts dt { color: var(--muted); }
.c-facts dd { margin: 0; }
.c-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
.c-btns .btn-main { grid-column: 1 / -1; }
.c-keys { font-size: 12px; color: var(--muted); padding: 10px 20px; }
.c-keys kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-family: inherit; background: var(--surface); }

@media (max-width: 1100px) {
  .b-grid, .c-grid { grid-template-columns: minmax(0, 1fr); }
  .c-call { grid-template-columns: minmax(0, 1fr); }
  .c-list { border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (max-width: 760px) {
  .rail { display: none; }
  .body { padding: 20px 16px 40px; }
  .top { padding: 10px 16px; }
  .a-head { font-size: 24px; }
  .b-tiles, .b-reasons { grid-template-columns: minmax(0, 1fr); }
  .b-li { flex-wrap: wrap; }
  .b-li .who { flex: 1 1 100%; }
  .c-stats { grid-template-columns: minmax(0, 1fr); }
  .c-stat + .c-stat { padding-left: 0; border-left: 0; border-top: 1px solid var(--line-soft); }
  .c-row { grid-template-columns: 10px 70px minmax(0, 1fr) 64px; }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="tool" role="toolbar" aria-label="시안 고르기">
  <span class="tool-name">세르클 화면 방향 시안</span>
  <div class="seg" id="segDir" aria-label="방향">
    <button type="button" data-dir="d">고른 안 A+C</button>
    <button type="button" data-dir="a">A 한 문장</button>
    <button type="button" data-dir="b">B 할 일 피드</button>
    <button type="button" data-dir="c">C 그래프 먼저</button>
  </div>
  <div class="seg" id="segScr" aria-label="화면">
    <button type="button" data-scr="home">원장 한눈에</button>
    <button type="button" data-scr="call">실장 오늘 연락</button>
  </div>
  <span class="tool-note" id="note"></span>
</div>

<div class="frame">
  <nav class="rail" id="rail" aria-label="메뉴"></nav>
  <div class="main">
    <div class="top" id="top"></div>
    <main class="body" id="view"></main>
  </div>
</div>

<script>
(function () {
  var NOTES = {
    d: 'A 틀 그대로에 C의 이번 달 매출 그래프를 맨 위로. 문장 하나가 그래프 제목이 되고, 버튼은 그래프 바로 아래 하나. 실장 화면은 A 그대로.',
    a: '한 화면에 문장 하나와 버튼 하나. 나머지는 한 줄로 접어 두고 눌러야 열립니다. 실장은 한 사람씩 넘깁니다.',
    b: '숫자 셋을 한 줄로, 그 아래 할 일 카드를 위에서부터. 카드마다 버튼 하나. 세르클이 해 둔 일은 오른쪽에 따로.',
    c: '이번 달 매출 그래프가 화면의 주인공. 숫자는 그래프 위에 하나, 아래에 작게 셋. 실장은 조용한 명단과 오른쪽 상세.'
  };

  var NAV = {

        '</div><button class="btn btn-main" type="button" style="width:100%">역산 계획 보기</button></section>' +
        '<section class="c-panel"><h3>오늘 할 일</h3><div class="c-todo num">' +
          '<div><span>보류 고객 연락</span><strong>18명</strong></div>' +

    return '<div class="c-call"><div class="c-list">' +

  }

  var VIEWS = { d: { home: dHome, call: aCall }, a: { home: aHome, call: aCall }, b: { home: bHome, call: bCall }, c: { home: cHome, call: cCall } };
  var state = { dir: 'd', scr: 'home' };

  function readHash() {
    var m = /^#([abcd])-(home|call)$/.exec(location.hash || '');
    if (m) { state.dir = m[1]; state.scr = m[2]; }
  }
  function render() {
    var role = state.scr === 'home' ? 'owner' : 'manager';
    drawRail(role, state.scr);
    drawTop(role);
    document.getElementById('view').innerHTML = VIEWS[state.dir][state.scr]();
    document.getElementById('note').textContent = NOTES[state.dir];
    document.querySelectorAll('[data-dir]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.dir === state.dir)); });
    document.querySelectorAll('[data-scr]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.scr === state.scr)); });
  }
  function go() { var h = '#' + state.dir + '-' + state.scr; if (location.hash !== h) location.hash = h; else render(); }
  document.getElementById('segDir').addEventListener('click', function (e) { var b = e.target.closest('[data-dir]'); if (b) { state.dir = b.dataset.dir; go(); } });
  document.getElementById('segScr').addEventListener('click', function (e) { var b = e.target.closest('[data-scr]'); if (b) { state.scr = b.dataset.scr; go(); } });
  window.addEventListener('hashchange', function () { readHash(); render(); });
  readHash(); render();
})();
</script>
