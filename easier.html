<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body><title>세르클 더 쉽게 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 시안 틀: 위에 고르기 띠, 아래에 세르클 화면 한 장(왼쪽 메뉴 216px + 본문). 다섯 곳마다 지금과 바꾼 뒤를 견준다. 기능은 그대로, 보여 주는 방식만 바꿨다 */
:root {
  color-scheme: light;
  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --soft: #F1F2F5;
  --tile: #F6F7F9;
  --ink: #16181D;
  --title: #3B4250;
  --muted: #5B6270;
  --off: #8A909B;
  --line: #E3E5EA;
  --line-soft: #EEF0F3;
  --accent: #C2492A;
  --accent-hover: #A63F22;
  --accent-tint: #FFF3EE;
  --accent-bar: #F2B8A2;
  --warn-fg: #8F5B00;
  --warn-bg: #FDF3DC;
  --good-fg: #1C7A4F;
  --good-bg: #E3F4EA;
  --nav-bg: #1F232A;
  --nav-title: #F2F3F5;
  --nav-fg: #B4BAC4;
  --nav-muted: #8A909B;
  --nav-on: #343A44;
  --nav-sep: #343A44;
  --tool-bg: #FFFFFF;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; }

/* 고르기 띠 */
.tool { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--tool-bg); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--tool-bg); }
.tool-name { font-weight: 700; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--soft); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(22,24,29,.08); }
.seg[hidden] { display: none; }
.tool-note { color: var(--muted); font-size: 12.5px; flex: 1 1 280px; min-width: 0; }

/* 세르클 화면 틀 */
.frame { display: flex; min-height: calc(100% - 56px); }
.rail { flex: 0 0 216px; background: var(--nav-bg); color: var(--nav-fg); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.rail-logo { display: flex; align-items: center; gap: 8px; color: var(--nav-title); font-weight: 700; font-size: 16px; padding: 0 8px 14px; }
.rail-logo i { width: 22px; height: 22px; border-radius: 50%; border: 5px solid #E2643E; display: inline-block; }
.rail-group { padding: 8px 0 10px; border-bottom: 1px solid var(--nav-sep); }
.rail-group:last-of-type { border-bottom: 0; }
.rail-cap { display: flex; gap: 10px; color: var(--nav-title); font-weight: 700; font-size: 13px; padding: 4px 8px 6px; }
.rail-cap b { color: var(--nav-muted); font-weight: 700; width: 12px; }
.rail-group.on .rail-cap b { color: #E2643E; }
.rail-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 8px 7px 30px; border-radius: 8px; font-size: 13px; width: 100%; background: none; border: 0; color: inherit; text-align: left; cursor: default; }
.rail-item.go { cursor: pointer; }
.rail-item.go:hover { background: #2A2F37; }
.rail-group.plain .rail-item { padding-left: 18px; }
.rail-item.on { background: var(--nav-on); color: var(--nav-title); font-weight: 700; }
.rail-badge { background: var(--accent); color: #fff; font-size: 11px; border-radius: 9px; padding: 0 7px; line-height: 18px; }
.rail-me { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px; font-size: 12.5px; color: var(--nav-muted); }
.rail-me i { width: 28px; height: 28px; border-radius: 50%; background: #343A44; color: var(--nav-title); font-style: normal; display: grid; place-items: center; font-weight: 700; }
.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--muted); }
.top strong { color: var(--ink); }
.top .sp { flex: 1; }
.tag-ex { background: var(--soft); color: var(--title); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
.body { flex: 1; padding: 28px 32px 64px; min-width: 0; }

/* 공용 조각 */
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn-main { background: var(--accent); color: #fff; }
.btn-main:hover { background: var(--accent-hover); }
.btn-main[disabled] { background: var(--line); color: var(--off); cursor: default; }
.btn-soft { background: var(--soft); color: var(--title); }
.btn-line { background: var(--surface); border: 1px solid var(--line); color: var(--title); }
.btn-big { padding: 15px 22px; font-size: 16px; border-radius: 12px; }
.link { color: var(--accent); font-weight: 600; background: none; border: 0; padding: 0; font-size: inherit; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.chev { color: var(--off); font-size: 18px; line-height: 1; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 8px; background: var(--soft); color: var(--title); white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
.pill.good { background: var(--good-bg); color: var(--good-fg); }
.pill.acc { background: var(--accent-tint); color: var(--accent); }
.card { background: var(--surface); border-radius: 14px; padding: 20px 22px; min-width: 0; }
.card h2 { font-size: 16px; margin: 0 0 4px; }
.card h3 { font-size: 14.5px; margin: 0 0 8px; }
.wrap { max-width: 1180px; }
.h-date { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.h-big { font-size: 28px; line-height: 1.35; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
.h-big em { font-style: normal; color: var(--accent); }
.lead { font-size: 15.5px; color: var(--title); margin: 8px 0 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; }

/* 숫자 이름표: 이름, 기준, 값, 예상 또는 실제 */
.base { display: inline-block; font-size: 11.5px; font-weight: 600; color: var(--title); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 8px; line-height: 19px; white-space: nowrap; vertical-align: 1px; }
.kind { font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 0 7px; line-height: 19px; white-space: nowrap; border: 1px solid transparent; vertical-align: 1px; }
.kind.real { background: var(--ink); color: #fff; }
.kind.est { background: var(--surface); color: var(--accent); border: 1px dashed var(--accent); }
.kind::after { content: " ?"; opacity: .55; font-weight: 600; }
.tip { margin-top: 8px; background: var(--tile); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--title); }
.tip b { color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.tile .k { font-size: 13px; color: var(--title); font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.tile .v { font-size: 24px; font-weight: 800; margin: 6px 0 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tile .v small { font-size: 14px; font-weight: 600; }
.tile .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.rows { display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; padding: 4px 18px; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line-soft); }
.row:first-child { border-top: 0; }
.row .t { flex: 1; min-width: 0; font-weight: 600; font-size: 14.5px; }
.row .t small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.row .v { font-weight: 800; white-space: nowrap; font-size: 16px; }
.names { display: flex; flex-direction: column; }
.name-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--line-soft); align-items: center; }
.name-row:first-child { border-top: 0; }
.name-row .n { font-weight: 600; }
.name-row .v { font-weight: 800; text-align: right; }
.name-row .w { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.name-row.same { background: linear-gradient(90deg, var(--tile), transparent); }
.legend2 { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; align-items: start; font-size: 13px; }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.meter { background: var(--tile); border-radius: 12px; padding: 12px 14px; }
.meter .k { font-size: 12.5px; font-weight: 600; color: var(--title); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.meter .v { font-size: 20px; font-weight: 800; margin-top: 4px; }
.meter .v small { font-size: 13px; font-weight: 600; color: var(--muted); }
.meter .track { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.meter .track span { display: block; height: 100%; background: var(--ink); }
.meter .s { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* 지금 화면 */
.now { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; max-width: 1240px; }
.shot { background: var(--surface); border-radius: 14px; padding: 12px; min-width: 0; }
.shot img { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); }
.shot .cap { font-size: 12.5px; color: var(--muted); margin: 8px 4px 0; }
.shot.phone-shot { justify-self: center; width: 100%; max-width: 414px; }
.hard { display: flex; flex-direction: column; gap: 10px; }
.hard h2 { font-size: 18px; margin: 0; }
.hard ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.hard li { color: var(--title); }
.hard q { display: block; quotes: "“" "”"; color: var(--ink); font-weight: 600; margin-top: 2px; font-size: 13px; }
.redraw { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.rd { background: var(--tile); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: var(--muted); }
.rd b { display: block; color: var(--ink); font-size: 18px; font-weight: 800; }
.rd .scr { font-weight: 700; color: var(--title); }
.path { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.path span { background: var(--tile); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--title); }
.path span.bad { background: var(--warn-bg); color: var(--warn-fg); font-weight: 600; }
.path i { font-style: normal; color: var(--off); }

/* 2 역산 계획 */
.gap-card { background: var(--surface); border-radius: 18px; padding: 24px 26px; }
.gap-k { font-size: 14px; color: var(--title); font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.gap-v { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin: 8px 0 4px; transition: color .2s; }
.gap-v small { font-size: 24px; font-weight: 700; }
.gap-v.done { color: var(--good-fg); }
.gap-bar { position: relative; height: 14px; border-radius: 7px; background: var(--soft); margin-top: 16px; overflow: hidden; display: flex; }
.gap-bar span { display: block; height: 100%; transition: width .2s; }
.gap-bar .goal { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.gap-legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.gap-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.knobs { display: flex; flex-direction: column; gap: 4px; background: var(--surface); border-radius: 18px; padding: 8px 26px; }
.knob { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 4px 16px; padding: 16px 0; border-top: 1px solid var(--line-soft); align-items: center; }
.knob:first-child { border-top: 0; }
.knob .k { font-weight: 700; font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.knob .k output { font-size: 18px; font-weight: 800; }
.knob .s { grid-column: 1 / 2; font-size: 12.5px; color: var(--muted); }
.knob .d { grid-row: 1 / 4; grid-column: 2; text-align: right; font-weight: 800; font-size: 18px; color: var(--muted); }
.knob .d.up { color: var(--good-fg); }
.knob .d small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.knob input[type=range] { grid-column: 1 / 2; width: 100%; accent-color: var(--accent); height: 28px; margin: 0; }
.plan-sum { background: var(--surface); border-radius: 18px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 76px; }
.plan-sum h3 { font-size: 15px; margin: 0; }
.plan-sum ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.plan-sum li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 13.5px; }
.plan-sum li:first-child { border-top: 0; }
.plan-sum li b { white-space: nowrap; }
.a-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; max-width: 1120px; }
.scen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.sc { text-align: left; background: var(--surface); border: 2px solid transparent; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sc:hover { border-color: var(--line); }
.sc[aria-pressed="true"] { border-color: var(--ink); }
.sc .t { font-size: 18px; font-weight: 800; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.sc .t .radio { flex: 0 0 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); }
.sc[aria-pressed="true"] .t .radio { border: 6px solid var(--ink); }
.sc .money { font-size: 26px; font-weight: 800; color: var(--good-fg); letter-spacing: -0.01em; }
.sc .money small { font-size: 14px; }
.sc dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.sc dt { color: var(--muted); }
.sc dd { margin: 0; color: var(--title); }
.sc .how { font-size: 13px; color: var(--title); background: var(--tile); border-radius: 10px; padding: 10px 12px; }
.pickbar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 16px; padding: 16px 20px; margin-top: 16px; }

/* 3 기간 */
.period { display: inline-flex; align-items: center; gap: 8px; }
.period .seg button { font-size: 13px; padding: 5px 12px; }
.period .seg { background: var(--soft); }
.pbanner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--title); margin-bottom: 18px; }
.pbanner .btn { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.pbanner .btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.pl-sec { margin-top: 22px; }
.pl-sec h2 { font-size: 15px; margin: 0 0 10px; color: var(--title); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--soft); margin: 10px 0 8px; }
.split span:first-child { background: var(--ink); }
.split span:last-child { background: var(--accent-bar); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px 6px; border-bottom: 1px solid var(--line-soft); }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.bad { font-weight: 800; color: var(--warn-fg); }
.empty-note { background: var(--tile); border-radius: 12px; padding: 14px 16px; color: var(--title); }

/* 4 왜 */
.ab { background: var(--surface); border-radius: 14px; padding: 6px 20px; }
.ab-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px 140px; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.ab-row:first-child { border-top: 0; }
.ab-row.head { font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 10px 0 8px; }
.ab-row .k { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.ab-row .c { text-align: right; font-weight: 800; font-size: 16px; }
.ab-row .c small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.tapnum { border: 0; background: var(--accent-tint); color: var(--accent); font-weight: 800; font-size: 16px; border-radius: 8px; padding: 4px 10px; text-decoration: underline dotted; text-underline-offset: 4px; }
.tapnum[aria-expanded="true"] { background: var(--accent); color: #fff; text-decoration: none; }
.why { grid-column: 1 / -1; background: var(--tile); border-radius: 14px; padding: 18px 20px; margin: 4px 0 8px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.why-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.why-head h3 { font-size: 17px; margin: 0; }
.why-head p { margin: 4px 0 0; color: var(--title); font-size: 13.5px; }
.why-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.rs { display: flex; flex-direction: column; gap: 8px; }
.r-btn { text-align: left; background: var(--surface); border: 2px solid transparent; border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; }
.r-btn[aria-pressed="true"] { border-color: var(--ink); }
.r-btn .no { font-weight: 800; color: var(--off); }
.r-btn .nm { font-weight: 700; font-size: 14px; }
.r-btn .ct { font-weight: 800; font-size: 16px; }
.r-btn .bar { grid-column: 2 / -1; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.r-btn .bar span { display: block; height: 100%; background: var(--accent-bar); }
.r-rest { font-size: 12.5px; color: var(--muted); padding: 2px 4px; }
.cust { background: var(--surface); border-radius: 12px; padding: 4px 14px; }
.cu { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); align-items: center; font-size: 13px; }
.cu:first-child { border-top: 0; }
.cu .who { font-weight: 700; font-size: 14px; }
.cu .who small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.cu .memo { color: var(--title); }
.cu .memo small { display: block; color: var(--muted); }
.why-act { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }

/* 5 휴대폰 */
.phone-wrap { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
.phone { width: 410px; max-width: 100%; height: 800px; background: var(--bg); border-radius: 34px; border: 10px solid #1F232A; overflow: hidden; display: flex; flex-direction: column; flex: 0 0 auto; box-shadow: 0 10px 30px rgba(22,24,29,.12); }
.ph-top { background: var(--surface); padding: 12px 16px 0; border-bottom: 1px solid var(--line); }
.ph-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.ph-title { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.ph-title h1 { font-size: 20px; margin: 0; }
.ph-title .seg button { padding: 4px 10px; font-size: 12px; }
.ph-sum { font-size: 13px; color: var(--title); margin: 6px 0 10px; }
.ph-tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 0 -16px; }
.ph-tab { border: 0; background: none; padding: 8px 2px 9px; border-bottom: 3px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 0; color: var(--muted); font-size: 12px; }
.ph-tab b { font-size: 17px; color: var(--title); font-weight: 800; line-height: 1.2; }
.ph-tab[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); font-weight: 700; }
.ph-tab[aria-selected="true"] b { color: var(--accent); }
.ph-list { flex: 1; overflow-y: auto; padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.ph-group { font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 6px 4px 0; display: flex; justify-content: space-between; }
.pc { background: var(--surface); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.pc .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.pc .nm { font-weight: 800; font-size: 15.5px; }
.pc .nm small { font-weight: 600; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
.pc .it { font-size: 13px; color: var(--title); }
.pc .memo { font-size: 12.5px; color: var(--muted); }
.pc .btns { display: flex; gap: 6px; margin-top: 6px; }
.pc .btns .btn { flex: 1; padding: 8px 10px; font-size: 13px; border-radius: 8px; }
.ph-empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 13.5px; }
.ph-nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 0 10px; font-size: 11.5px; color: var(--muted); text-align: center; }
.ph-nav span.on { color: var(--ink); font-weight: 700; }
.ph-nav em { font-style: normal; background: var(--accent); color: #fff; border-radius: 8px; padding: 0 5px; font-size: 10.5px; margin-left: 2px; }
.side-notes { flex: 1 1 300px; min-width: 0; max-width: 460px; display: flex; flex-direction: column; gap: 12px; }
.side-notes h2 { font-size: 20px; margin: 0; }
.side-notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; color: var(--title); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 16px; font-size: 13.5px; display: flex; gap: 14px; align-items: center; z-index: 40; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }

.m1 { max-width: 800px; margin-inline: auto; display: flex; flex-direction: column; gap: 32px; width: 100%; }

.explain-wrap { padding: 0 32px 64px; }

  // 예시 계산. P-1의 실제 비율(지난 3개월): 객단가 55.7만 원, 초진 당일 결제율 58.4%, 내원율 84.2%, 예약률 52.5%, 문의 1건당 광고비 46,127원,
  // 재진 1건당 13.1만 원, 연락 후 예약 28.9%, 재진 내원율 94.7%. 남은 21일 초진 상담은 이번 주 월~목 44건(하루 11건)으로 231건.
  var M = { R: 231, T: 55.7, P0: 58.4, V0: 84.2, BK: 0.525, CPI: 4.6127, RB: 0.289, RV: 0.947, RT: 13.1, GAP: 1668, FC: 18332, GOAL: 20000, SHARE_A: 0.588 };
  function gains(k) {
    var B0 = M.R / (M.V0 / 100);
    var inq = k.a / M.CPI;
    var consults = (B0 + inq * M.BK) * k.v / 100;
    var newRev = consults * k.p / 100 * M.T;
    var baseRev = M.R * M.P0 / 100 * M.T;
    var dP = M.R * (k.p - M.P0) / 100 * M.T;
    var dV = B0 * (k.v - M.V0) / 100 * k.p / 100 * M.T;
    var dA = inq * M.BK * k.v / 100 * k.p / 100 * M.T;
    var dC = k.c * M.RB * M.RV * M.RT;

        '<div class="ph-nav"><span>연락<em>11</em></span><span class="on">상담 보드</span><span>문의함<em>1</em></span><span>내 숫자</span><span>더보기</span></div>' +
      '</div>' +
      '<aside class="side-notes"><span class="pill good" style="align-self:flex-start">바꾼 뒤</span><h2>휴대폰에서는 단계 하나씩</h2><ul>' +
        '<li>여섯 칸 대신 탭 다섯 개예요. 탭마다 몇 명인지 크게 보여요.</li>' +
        '<li>보류는 오래된 순이에요. 7일 넘은 16명이 맨 위에 따로 모여요.</li>' +
        '<li>카드마다 전화 끝번호와 상담 메모 한 줄, 전화와 문자 버튼이 있어요.</li>' +
        '<li>내원과 상담 중은 하나로 합쳤어요. 스마트닥터에 접수되면 저절로 옮겨지는 건 그대로예요.</li>' +
        '<li>노트북에서는 지금처럼 여섯 칸 보드예요.</li>' +
      '</ul></aside></div>';
  }

  var VIEWS = { 1: [s1now, s1after], 2: [s2now, null], 3: [s3now, s3after], 4: [s4now, s4after], 5: [s5now, s5after] };
  var RAIL = { 1: ['owner', 'home'], 2: ['owner', 'backcalc'], 3: ['owner', 'pl'], 4: ['owner', 'team'], 5: ['manager', 'board'] };

  function readHash() {
    var m = /^#([1-5])-(now|after)(?:-([ab]))?$/.exec(location.hash || '');
    if (m) { state.spot = +m[1]; state.view = m[2]; if (m[3]) state.dir = m[3]; }
  }
  function render() {
    var rr = RAIL[state.spot];
    var on = state.spot === 3 && state.view === 'after' ? state.scr3 : rr[1];
    drawRail(rr[0], on);
    drawTop(rr[0]);
    var v = document.getElementById('view');
    if (state.spot === 2 && state.view === 'after') v.innerHTML = state.dir === 'a' ? s2a() : s2b();
    else v.innerHTML = VIEWS[state.spot][state.view === 'now' ? 0 : 1]();
    document.getElementById('explain').innerHTML = state.spot === 1 && state.view === 'after' ? s1explain() : '';
    var key = state.spot + state.view + (state.spot === 2 && state.view === 'after' ? state.dir.toUpperCase() : '');
    document.getElementById('note').textContent = NOTES[key];
    document.getElementById('segDir').hidden = !(state.spot === 2 && state.view === 'after');
    document.querySelectorAll('[data-spot]').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.spot === state.spot)); });
    document.querySelectorAll('[data-view]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.view === state.view)); });
    document.querySelectorAll('[data-dir]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.dir === state.dir)); });
  }
  function go() {
    var h = '#' + state.spot + '-' + state.view + (state.spot === 2 && state.view === 'after' ? '-' + state.dir : '');
    if (location.hash !== h) location.hash = h; else render();
  }
  var toastT;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.innerHTML = '<span>' + msg + '</span><button type="button" data-act="undo">되돌리기</button>';
    t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 4000);
  }

  document.querySelector('.tool').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.spot) { state.spot = +b.dataset.spot; go(); }
    else if (b.dataset.view) { state.view = b.dataset.view; go(); }
    else if (b.dataset.dir) { state.dir = b.dataset.dir; go(); }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.closest('.tool')) return;
    if (b.dataset.tip) { state.tip = state.tip === b.dataset.tip ? null : b.dataset.tip; render(); return; }
    if (b.dataset.period) { state.period = b.dataset.period; render(); return; }
    if (b.dataset.scr3) { state.scr3 = b.dataset.scr3; render(); return; }
    if (b.dataset.pick) { state.pick = +b.dataset.pick; render(); return; }
    if (b.dataset.reason) { state.reason = +b.dataset.reason; state.added = false; render(); return; }
    if (b.dataset.tab5) { state.tab5 = b.dataset.tab5; render(); return; }
    var a = b.dataset.act;
    if (a === 'why') { state.why = !state.why; render(); }
    else if (a === 'closewhy') { state.why = false; render(); }
    else if (a === 'addlist') { state.added = true; render(); toast('실장B 오늘 연락 명단 맨 위에 넣었어요.'); }
    else if (a === 'commit') { toast('이 계획으로 정했어요. 계획 대비와 연락 명단이 바뀌었어요.'); }
    else if (a === 'reset') { state.k = { p: 58.4, v: 84.2, c: 0, a: 0 }; render(); }
    else if (a === 'undo') { document.getElementById('toast').hidden = true; if (state.added) { state.added = false; render(); } }
  });
  document.addEventListener('input', function (e) {
    var k = e.target.dataset && e.target.dataset.k; if (!k) return;
    state.k[k] = parseFloat(e.target.value); updateA();
  });
  document.addEventListener('toggle', function (e) { if (e.target.classList && e.target.classList.contains('explain')) state.explain = e.target.open; }, true);
  window.addEventListener('hashchange', function () { readHash(); render(); });
  window.easierSet = function (o) { for (var x in o) state[x] = o[x]; render(); };
  readHash(); render();
})();
</script>
